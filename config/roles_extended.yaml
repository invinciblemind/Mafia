# Расширенный набор: обязательные роли плюс три дополнительные.
#
# Допустимые имена ролей (регистр не важен, можно по-русски):
#   doctor / доктор, commissar / комиссар, maniac / маньяк,
#   sergeant / сержант, resuscitator / реаниматор, thief / вор
# mafia и civilian указывать не нужно — они есть в любой игре.
#
# Вор занимает одно из мест мафии (входит в floor(N / mafia_divisor)),
# остальные роли — по одному игроку сверх мафии.
mafia_divisor: 3
roles:
  - doctor
  - commissar
  - maniac
  - sergeant      # знает Комиссара, при его гибели занимает его место
  - resuscitator  # воскрешает погибших (вводится при двух и более стреляющих сторонах)
  - thief         # мафиози, блокирует способности мирного
